name: Build, Harden & Deploy RavanaTek (Cloud Run + Firebase Hosting)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ravanatek-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'ravanatek' }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  SERVICE_NAME: ravanatek-backend
  HOSTING_SITE: ravanatek
  FIRESTORE_DB: ${{ vars.FIRESTORE_DATABASE_ID || 'ravanatek-db' }}

jobs:
  ci_build_and_test:
    name: CI Lint, Security Tests & Allowlist Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build allowlisted public-build directory
        run: npm run build

      - name: Run Express security regression tests
        run: npm run test:security

      - name: Run contact inquiry regression tests
        run: npm run test:contact

      - name: Upload public-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravanatek-public-build
          path: public-build
          include-hidden-files: true
          retention-days: 3

  deploy_cloud_run:
    name: Deploy Cloud Run Backend (ravanatek-backend)
    needs: ci_build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing GCP_SA_KEY (or FIREBASE_SERVICE_ACCOUNT_RAVANATEK) secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build & push container image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=ravanatek-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --port=8080
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=5
            --concurrency=80
            --timeout=60
          env_vars: |
            NODE_ENV=production
            STORAGE_BACKEND=cloud
            FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }}
            FIRESTORE_DATABASE_ID=${{ env.FIRESTORE_DB }}

  deploy_firebase:
    name: Deploy Firebase Hosting (Site ravanatek only)
    needs: deploy_cloud_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public-build artifact
        uses: actions/download-artifact@v4
        with:
          name: ravanatek-public-build
          path: public-build

      - name: Check Firebase auth secret
        id: authcheck
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Neither GCP_SA_KEY nor FIREBASE_TOKEN secret is configured."
            exit 1
          fi
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_sa_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sa_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (ADC for Firebase CLI)
        if: ${{ steps.authcheck.outputs.has_sa_key == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEK || secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting (ravanatek site ONLY - never touches raone-ai or raone-suva-seva)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            firebase deploy --only "hosting:${{ env.HOSTING_SITE }}" --project "${{ env.PROJECT_ID }}" --non-interactive
          else
            firebase deploy --only "hosting:${{ env.HOSTING_SITE }}" --project "${{ env.PROJECT_ID }}" --token "$FIREBASE_TOKEN" --non-interactive
          fi

      - name: Deploy Firestore Rules (ravanatek-db ONLY - Opt-in via DEPLOY_FIRESTORE_RULES=true)
        if: ${{ vars.DEPLOY_FIRESTORE_RULES == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            firebase deploy --only "firestore:${{ env.FIRESTORE_DB }}" --project "${{ env.PROJECT_ID }}" --non-interactive
          else
            firebase deploy --only "firestore:${{ env.FIRESTORE_DB }}" --project "${{ env.PROJECT_ID }}" --token "$FIREBASE_TOKEN" --non-interactive
          fi
