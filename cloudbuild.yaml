steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend:$SHORT_SHA"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "ravanatek-backend"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend:$SHORT_SHA"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=ravanatek-backend-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--concurrency=80"
      - "--timeout=60"
      - "--set-env-vars=NODE_ENV=production,STORAGE_BACKEND=cloud,FIREBASE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=ravanatek-db"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend:$SHORT_SHA"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ravanatek-backend:latest"
