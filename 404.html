<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#00050A">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=rt3">
    <title>404 // Resource Not Found | RAVANA TECH</title>
    <style>
        body {
            background: #00050A;
            color: #D9F5FF;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            text-align: center;
        }
        .box {
            max-width: 480px;
            border: 1px solid rgba(0, 191, 255, 0.35);
            background: rgba(2, 18, 30, 0.85);
            padding: 2rem;
            border-radius: 8px;
        }
        h1 { color: #18C8FF; margin: 0 0 0.75rem; font-size: 2rem; }
        p { color: #8DBFD8; margin: 0 0 1.5rem; line-height: 1.5; }
        a {
            display: inline-block;
            padding: 0.65rem 1.25rem;
            border: 1px solid #18C8FF;
            color: #18C8FF;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
        }
        a:hover { background: #18C8FF; color: #00050A; }
    </style>
</head>
<body>
    <div class="box">
        <h1>404 // NOT FOUND</h1>
        <p>The requested endpoint or document does not exist on this server.</p>
        <a href="/">RETURN TO HOME</a>
    </div>
</body>
</html>
